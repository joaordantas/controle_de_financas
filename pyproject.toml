[project]
name = "controle-de-financas"
version = "0.2.0"
description = "Assistente financeiro pessoal com FastAPI e React."
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt",
    "email-validator",
    "fastapi>=0.141.1,<1.0",
    "uvicorn",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"

[tool.vercel.fastapi.static]
cdn = true
exclude = true
